name: SNS Marketing Automation

on:
  schedule:
    # 한국 시간(KST) 오전 8:23 (UTC 전날 23:23), 오후 6:23 (UTC 09:23)
    # GitHub 서버 딜레이(지연)를 완벽 회피하도록 딜레이 없는 Off-peak 시간대로 재조정
    - cron: '23 23,9 * * *'
  workflow_dispatch: # 수동 실행 버튼 제공

jobs:
  run-marketing:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18
        cache: 'npm'

    - name: Install Korean Fonts, FFmpeg and Python Edge TTS
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg fonts-nanum fonts-noto-cjk python3-pip
        python3 -m pip install edge-tts

    - name: Install dependencies
      run: npm ci

    - name: Build TypeScript
      run: npm run build

    - name: Run Master All Shorts & SNS Marketing Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        DRAFT_ETHAN_URL: ${{ secrets.DRAFT_ETHAN_URL }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: npx ts-node run_all.ts
