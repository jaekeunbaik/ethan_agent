name: SNS Marketing Automation

on:
  schedule:
    # 한국 시간(KST) 오전 10:47, 오후 5:47 실행 (UTC 기준 01:47, 08:47)
    # GitHub Actions 특성상 :00, :15, :30, :45분은 전 세계 스케줄 쏠림으로 1~2시간 지연 실행됨
    # :47분과 같은 비정상 분(Off-peak)으로 설정해야 큐 대기 없이 제시간에 실행됨
    - cron: '47 1,8 * * *'
  workflow_dispatch: # 수동 실행 버튼 제공

jobs:
  run-marketing:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18
        cache: 'npm'

    - name: Install Korean Fonts, FFmpeg and Python Edge TTS
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg fonts-nanum fonts-noto-cjk python3-pip
        python3 -m pip install edge-tts

    - name: Install dependencies
      run: npm ci

    - name: Build TypeScript
      run: npm run build

    - name: Run SNS Marketing Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        DRAFT_ETHAN_URL: ${{ secrets.DRAFT_ETHAN_URL }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      # 스케줄러 실행 시 1회 포스팅을 즉시 올리도록 --test(즉시실행) 모드로 수행합니다
      run: node dist/marketingAutomation.js --test
