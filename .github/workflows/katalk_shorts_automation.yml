name: 🎬 KatalkViral YouTube Shorts Autonomous Factory

on:
  schedule:
    # 1차 골든 타임: 매일 한국 시간(KST) 18:30 (UTC 09:30) - 퇴근/저녁 피크
    - cron: '30 9 * * *'
    # 2차 골든 타임: 매일 한국 시간(KST) 22:30 (UTC 13:30) - 심야 숏폼 시청 피크
    - cron: '30 13 * * *'
  workflow_dispatch: # 깃허브 웹 화면에서 [Run workflow] 버튼으로 즉시 수동 실행 가능
  push:
    paths:
      - 'trigger.txt'

jobs:
  run-katalk-shorts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Korean Fonts, FFmpeg and Python Edge TTS
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg fonts-nanum fonts-noto-cjk python3-pip
        python3 -m pip install --break-system-packages edge-tts || python3 -m pip install edge-tts || true

    - name: Install dependencies
      run: npm ci

    - name: Build TypeScript
      run: npm run build

    - name: Ensure binary permissions
      run: |
        chmod -R +x node_modules/ffmpeg-static || true
        chmod -R +x node_modules/ffprobe-static || true

    - name: Run 5-Agent Katalk Shorts Factory
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        COUPANG_PARTNERS_URL: ${{ secrets.COUPANG_PARTNERS_URL || 'https://link.coupang.com/a/h183YcFkvA' }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: node dist/run_kakaotalk_shorts.js

    - name: Upload Generated Shorts to GitHub Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: generated-shorts-videos
        path: output_shorts/*.mp4
        retention-days: 7

    - name: Commit Feedback Memory back to repository
      if: success()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add feedback_memory.json || true
        git diff-index --quiet HEAD || git commit -m "chore(feedback): update self-evolution memory [skip ci]"
        git push || true
