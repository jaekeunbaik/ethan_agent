name: 🎬 AlphaShorts YouTube Autonomous Factory

on:
  schedule:
    # 1차: 한국 시간(KST) 평일 15:53 (UTC 06:53) - 50분대 트래픽 정체 회피
    - cron: '53 6 * * 1-5'
    # 2차 Failover: 한국 시간(KST) 평일 16:15 (UTC 07:15) - 1차 누락 시 백업 가동
    - cron: '15 7 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'trigger.txt'

jobs:
  run-alpha-shorts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Korean Fonts, FFmpeg and Python Edge TTS
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg fonts-nanum fonts-noto-cjk python3-pip
        python3 -m pip install --break-system-packages edge-tts || python3 -m pip install edge-tts || true

    - name: Install dependencies
      run: npm ci

    - name: Build TypeScript
      run: npm run build

    - name: Run AlphaShorts and Upload to YouTube Shorts
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: npx ts-node run_alpha_shorts.ts
